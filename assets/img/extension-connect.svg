<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" role="img"><title>The workspace shows a six digit code that is typed into the extension popup, which then shows Connected</title><style>
.card{fill:#f6f7f9;stroke:#cfd6e0}.panel{fill:#fff;stroke:#cfd6e0}.t{fill:#1a2230;font:500 13px system-ui,sans-serif}.m{fill:#566275;font:12px system-ui,sans-serif}.big{fill:#1a2230;font:500 22px ui-monospace,monospace}
.ac{fill:#0f766e}.acl{fill:#d9efeb;stroke:#0f766e}.acs{fill:none;stroke:#0f766e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.on{fill:#fff;font:500 12px system-ui,sans-serif}.bad{fill:none;stroke:#b42318;stroke-width:2.5;stroke-linecap:round}.badt{fill:#b42318;font:500 12px system-ui,sans-serif}.bar{fill:#cfd6e0}
@media(prefers-color-scheme:dark){.card{fill:#1d2631;stroke:#34404f}.panel{fill:#161d27;stroke:#34404f}.t,.big{fill:#e6ebf2}.m{fill:#9aa7b9}.ac{fill:#2dd4bf}.acl{fill:#12332f;stroke:#2dd4bf}.acs{stroke:#2dd4bf}.on{fill:#06201d}.bad{stroke:#fda29b}.badt{fill:#fda29b}.bar{fill:#34404f}}
@keyframes pop{0%,10%{opacity:0;transform:scale(.85)}25%,100%{opacity:1;transform:scale(1)}}
@keyframes fade{0%,10%{opacity:0}25%,100%{opacity:1}}
@keyframes fill{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
@keyframes draw{0%{stroke-dashoffset:var(--len,200)}60%,100%{stroke-dashoffset:0}}
@keyframes hop{0%{transform:translateX(0)}50%{transform:translateX(150px)}100%{transform:translateX(0)}}
.a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-out;transform-box:fill-box;transform-origin:left center}
@media(prefers-reduced-motion:reduce){.a{animation:none!important}}
</style><rect x="20" y="30" width="250" height="150" rx="10" class="card" /><text x="40" y="60" class="t" >Workspace · Extensions page</text><text x="40" y="95" class="t" >Connect extension</text><rect x="40" y="110" width="120" height="30" rx="8" class="ac" /><text x="100" y="130" class="on" text-anchor="middle">Connect extension</text><text x="40" y="165" class="m" >Code expires in 5:00</text><rect x="310" y="30" width="330" height="150" rx="10" class="panel" /><text x="330" y="60" class="t" >Extension popup</text><text x="330" y="90" class="m" >One-time code</text><rect x="330" y="100" width="200" height="40" rx="8" class="card" /><text x="345" y="128" class="big a" style="animation-name:fade;animation-delay:0.6s">4</text><text x="371" y="128" class="big a" style="animation-name:fade;animation-delay:1.1s">8</text><text x="397" y="128" class="big a" style="animation-name:fade;animation-delay:1.6s">2</text><text x="449" y="128" class="big a" style="animation-name:fade;animation-delay:2.6s">9</text><text x="475" y="128" class="big a" style="animation-name:fade;animation-delay:3.0s">1</text><text x="501" y="128" class="big a" style="animation-name:fade;animation-delay:3.5s">3</text><rect x="540" y="100" width="80" height="40" rx="8" class="ac" /><text x="580" y="125" class="on" text-anchor="middle">Connect</text><g class="a" style="animation-name:fade;animation-delay:4.4s"><rect x="330" y="150" width="290" height="24" rx="6" class="acl" /><text x="345" y="167" class="t" >Connected</text></g></svg>
